<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Takeoff</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="style.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

</head>
<body>
<nav class="navbar navbar-dark navbar-expand-lg bg-body-tertiary fixed-top own-top-nav primary-gradient">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">
        <img src="../spacetravellogovar3.png" alt="Airspace spacetravel" height="25px" class="me-4">
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="#">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">Booking</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">Deals</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" aria-disabled="true">About</a>
        </li>
      </ul>
        <span class="navbar-text ms-auto">
        <i style="font-size: 25px; color: white; padding-right: 20px;" class="bi bi-person-circle btn"></i>
      </span>
      </div>
    </div>
  </nav>

  <div class="background-container">
      <img src="Gemini_Generated_Image_5bmud5bmud5bmud5.png" alt="background image">
      <div class="image-overlay"></div>
  </div>

  <section class="booking-container">

    <div class="booking-div">
      <div class="decoration-div primary-gradient">
        <h1>Where to?</h1>
      </div>
      <form action="/flights/search" method="GET" class="was-validated">
        <div class="form-container">
                  <div class="form-check">
            <input class="form-check-input" type="checkbox" value="" id="returnToggle" checked>
             <label class="form-check-label" for="checkDefault">
              Round Trip
              </label>
              </div>      
          <div class="row gy-4">
            <div class="col-6">
              <label for="startInput" class="form-label">From</label>
              <input type="text" name="origin" class="form-control" aria-label="From" id="fromInput" required>
            </div>
              <div class="col-6">
                <label for="toInput" class="form-label">To</label>
                <input type="text" name="destination" class="form-control" aria-label="To" id="toInput">
              </div>
              <div class="col-6">
                <label for="liftoffInput" class="form-label">Lift off date</label>
                <input type="date" name="outboundDate" class="form-control" id="liftoffInput">
              </div>
                <div class="col-6" id="returnDateContainer">
                  <label for="returnInput" class="form-label">Return Date</label>
                  <input type="date" name="returnDate" class="form-control" id="landingInput">
              </div>
              <div class="col-6">
                  <label for="travelerInput" class="form-label">Adults</label>
                  <select name="adultCount" class="form-control" id="travelersInput" required>
                    <option value="1">1 Adult</option>
                    <option value="2">2 Adults</option>
                    <option value="3">3 Adults</option>
                    <option value="4">4 Adults</option>
                    <option value="5">5 Adults</option>
                    <option value="6">6 Adults</option>
                    <option value="7">7 Adults</option>
                    <option value="8">8 Adults</option>
                    <option value="9">9 Adults</option>
                    <option value="10">10 Adults</option>
                  </select>
                  </div>
                  <div class="col-6">
                    <label for="travelerInput" class="form-label">Children</label>
                    <select name="childCount" class="form-control" id="travelersInput" required>
                    <option value="0">No Children</option>
                    <option value="1">1 Child</option>
                    <option value="2">2 Children</option>
                    <option value="3">3 Children</option>
                    <option value="4">4 Children</option>
                    <option value="5">5 Children</option>
                    <option value="6">6 Children</option>
                    <option value="7">7 Children</option>
                    <option value="8">8 Children</option>
                    <option value="9">9 Children</option>
                    <option value="10">10 Children</option>
                    </select>
                  </div>
              <div class="col-6">
                  <label for="classInput" class="form-label">Travel class</label>
                  <select name="travelClass" class="form-control" id="classInput" required>
                    <option value="Economy">Economy class</option>
                    <option value="Business">Business class</option>
                    <option value="First">First class</option>
                  </select>
              </div>
              <div class="col-4" id="bookingFillerDiv"></div> 
              <div class="col-2">
                <button type="submit" class="own-std-btn primary-gradient" id="searchFlightBtn">Search</button>
              </form>
              </div>
            </div>
          </div>
          </div>
        </div>
    </div>
    <div class="offers-div">
      <div class="decoration-div primary-gradient">
      </div>
    </div>
  </section>

  <section class="footer primary-gradient">
    <div class="container"> 
      <div class="row">
        <div class="col">
            <p class="weight-600">About Airspace</p>
            <ul>
              <li><a>About Us</a></li>
              <li><a>Careers</a></li>
              <li><a>Investor relations</a></li>
            </ul>
            
        </div>
        <div class="col">
          <p class="weight-600">Customer Service</p>
          <ul>
            <li><a>Help center</a></li>
          </ul>

        </div>
        <div class="col">
          <p class="weight-600">Policies</p>
          <ul>
            <li><a>Customer Complaint</a></li>
            <li><a>Legal</a></li>
          </ul>

        </div>
      </div>
    </div>
  </section>


    <!--Bootstrap-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="script.js"></script>

</body>
</html>
